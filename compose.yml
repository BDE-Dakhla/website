services:
  database:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: bde-dakhla-db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: bdedakhlapwd
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d bde-dakhla-db -h 127.0.0.1']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  postfix:
    image: boky/postfix
    environment:
      ALLOW_EMPTY_SENDER_DOMAINS: "true"
      SMTP_SERVER: ""
    # configure DKIM, SPF, etc. as needed; consult image docs
    ports:
    - "25:25"

volumes:
  pgdata: